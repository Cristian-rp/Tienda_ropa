<!-- PESTAÑA 5: VENTAS -->
<section id="tab-ventas" class="tab-content">
    <div class="layout-two-columns">
        <div class="card-sidebar">
            <h2 class="card-title">Registrar Venta</h2>
            <form id="form-venta" class="form-vertical">
                <div class="form-group">
                    <label>CLIENTE:</label>
                    <select name="id_cliente" id="select-cliente-venta" required>
                        <option value="">Seleccione Cliente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>PRENDA:</label>
                    <select name="id_prenda" id="select-prenda-venta" required>
                        <option value="">Seleccione Prenda</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>CANTIDAD:</label>
                    <input type="number" name="cantidad" id="venta-cantidad" value="1" min="1" required>
                </div>
                <div class="form-group">
                    <label>TOTAL $:</label>
                    <input type="number" step="0.01" name="total" id="venta-total" readonly placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>MÉTODO PAGO (MYSQL ENUM):</label>
                    <select name="metodo_pago" required>
                        <option value="">Seleccione...</option>
                        <option value="Efectivo">Efectivo (Contraentrega)</option>
                        <option value="Tarjeta">Tarjeta Débito/Crédito (API)</option>
                        <option value="Transferencia">Transferencia PSE (API)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>PUNTO DE ENTREGA (MAPA API):</label>
                    <div id="map"></div>
                </div>
                <button type="submit" id="btn-procesar-venta">Procesar Venta</button>
            </form>
        </div>
        <div class="card-main">
            <h2 class="card-title">Ventas Registradas</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>CLIENTE</th>
                            <th>PRENDA</th>
                            <th>CANT.</th>
                            <th>TOTAL</th>
                            <th>PAGO</th>
                            <th>FECHA VENTA</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-ventas"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
